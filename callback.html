<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Anmeldung · Warum eigentlich?</title><link rel="stylesheet" href="style.css">
<style>textarea{width:100%;height:110px;background:#0f1638;color:#f4f8ff;border:1px solid #3f86b0;border-radius:8px;padding:10px;font:14px/1.4 monospace}button{margin-top:10px;background:#5ce1ff;color:#0b1026;border:0;border-radius:8px;padding:10px 18px;font-weight:800;cursor:pointer}</style></head>
<body><main>
<p class="brand"><a href="index.html" style="color:inherit;text-decoration:none">◆ Warum eigentlich<span class="q">?</span></a></p>
<h1>Anmeldung bei TikTok</h1>
<div id="ok" hidden>
<p>Die Anmeldung hat geklappt. Diese Adresse kopieren und in <code>tools/tiktok_auth.py</code> einfügen:</p>
<textarea id="url" readonly></textarea>
<button id="copy">Kopieren</button>
</div>
<p id="err" hidden></p>
<p id="none">Diese Seite empfängt die Rückmeldung nach der Anmeldung bei TikTok für „Warum eigentlich Upload“.</p>
<script>
const q = new URLSearchParams(location.search);
if (q.get("code")) {
  document.getElementById("none").hidden = true;
  document.getElementById("ok").hidden = false;
  document.getElementById("url").value = location.href;
  document.getElementById("copy").onclick = () => { navigator.clipboard.writeText(location.href); document.getElementById("copy").textContent = "Kopiert ✓"; };
} else if (q.get("error")) {
  document.getElementById("none").hidden = true;
  const e = document.getElementById("err"); e.hidden = false;
  e.textContent = "TikTok meldet einen Fehler: " + q.get("error") + " " + (q.get("error_description") || "");
}
</script>
</main></body></html>
